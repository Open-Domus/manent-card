[project]
name = "manent-card"
version = "0.1.0"
description = "Hardware design of the Manent card: parts, schematic generator, mechanical fit model"
license = "CERN-OHL-S-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mechanical", "electrical", "."]
