# Single source for part bodies and BOM fields.
# size: [length, width, height above the board], millimetres.
# status: verified   = read on a manufacturer page or datasheet
#         secondary  = distributor, press release or teardown summary
#         unverified = from memory or an estimate; check before freezing
# Entries shared with the ring and the band carry the status they have there.
parts:
  soc:
    function: BLE system-on-chip
    manufacturer: Nordic Semiconductor
    mpn: nRF54L15-QFAA
    package: QFN-48, 6 x 6 mm, 0.4 mm pitch
    size: [6.0, 6.0, 0.85]
    status: secondary        # dimension table read once as page text; see parts/pins
    url: https://docs.nordicsemi.com/r/bundle/ps_nrf54l15/page/chapters/mec_spec.html
  pmic:
    function: Charger, 1.8 V buck, load switches, ship mode
    manufacturer: Nordic Semiconductor
    mpn: nPM1300-QEAA
    package: QFN-32, 5 x 5 mm, 0.5 mm pitch
    size: [5.0, 5.0, 0.85]
    status: secondary        # same package as the nPM1304 of the band; see parts/pins
    url: https://docs.nordicsemi.com/r/bundle/ps_npm1300/page/product_overview.html
  flash:
    function: 256 Mbit 1.8 V SPI NOR flash
    manufacturer: Winbond
    mpn: W25Q256JWEIQ
    package: WSON-8, 8 x 6 mm
    size: [8.0, 6.0, 0.8]
    status: secondary        # distributor listing; height and pin order not read
    url: https://www.winbond.com/hq/product/code-storage-flash/qspi-nor/
  mic:
    function: PDM MEMS microphone with wake-on-sound, bottom port
    manufacturer: TDK InvenSense
    mpn: T5838
    package: LGA, bottom port
    size: [2.65, 3.5, 0.98]  # long side across the board strip
    status: verified
    url: https://invensense.tdk.com/products/digital/t5838/
  button:
    function: Tactile switch pressed from the edge of the board, 1.6 N
    manufacturer: Panasonic
    mpn: EVQP7J01P
    package: SMD side-push, 3.5 x 2.9, straight terminals, no boss
    size: [3.5, 2.9, 1.35]
    actuator: 0.65           # the knob beyond the body
    status: verified         # catalogue ANCTB21E 2025-07: drawing, land pattern, rating 10 uA 2 V to 50 mA 12 V, 30 N push strength
    url: https://industry.panasonic.com/ac/cdn/e/control/switch/light-touch/catalog/sw_lt_eng_3529s_side.pdf
  slide:
    function: Slide switch, one pole two positions, slider parallel to the board
    manufacturer: Alps Alpine
    mpn: SSSS811101
    package: SMD, 6.7 x 2.6, with ground terminals and two locating bosses
    size: [6.7, 2.6, 1.4]
    actuator: 1.5            # the slider beyond the body
    status: verified         # maker's page and SSSS8 catalogue 2025-10: horizontal actuator, 1.5 travel, 0.3 A 5 V max, 50 uA 3 V min, 10,000 cycles
    url: https://tech.alpsalpine.com/e/products/detail/SSSS811101/
  vps:
    function: Vibration sensor with a PDM output, hears the phone through its back
    manufacturer: Syntiant (formerly Knowles)
    mpn: V2S200D
    package: LGA-6, 3.3 x 2.3
    size: [3.3, 2.3, 0.93]
    status: verified         # datasheet revision C: pins, land pattern, SELECT table, senses along Z, 290 uA at 768 kHz
    url: https://www.syntiant.com
  led:
    function: Recording light, mounted upside down to shine through a hole in the board
    manufacturer: Wuerth Elektronik
    mpn: 156125RS75000
    package: "reverse-mount 1205"
    size: [3.2, 1.2, 0.3]    # what stays on the parts side: the lens, 0.82 more, goes into the board
    status: verified         # datasheet 001.001: 3.2 x 1.2 x 1.1, hole 1.75, pads 1.0 x 1.2 at 3.4 centres, pad 1 cathode, 2.0 V and 110 mcd at 20 mA
    url: https://www.we-online.com/components/products/datasheet/156125RS75000.pdf
  xtal32m:
    function: 32 MHz crystal
    manufacturer: Kyocera
    mpn: to choose
    package: "2016"
    size: [2.0, 1.6, 0.5]
    status: unverified       # package from Nordic's QFN48 reference; part and height not chosen
    url: ""
  xtal32k:
    function: 32.768 kHz crystal
    manufacturer: TXC
    mpn: 9HT11-32.768KDZC-T
    package: "2012"
    size: [2.0, 1.2, 0.6]
    status: secondary        # part from Nordic's reference list; height not checked
    url: ""
  inductor:
    function: Buck inductor, 2.2 uH
    manufacturer: Murata
    mpn: to choose
    package: "0806 (2016 metric)"
    size: [2.0, 1.6, 1.0]
    status: unverified
    url: ""
  protector:
    function: Cell protection
    manufacturer: ABLIC
    mpn: S-82A1A
    package: DFN-6 1.4 x 1.4
    size: [1.4, 1.4, 0.5]
    status: secondary        # body verified, height not extracted
    url: https://www.ablic.com/en/doc/datasheet/battery_protection/S82A1A_E.pdf
  antenna:
    function: 2.4 GHz chip antenna
    manufacturer: to choose
    mpn: to choose
    package: "1608 chip antenna"
    size: [1.6, 0.8, 0.4]
    status: unverified
    url: ""
  contact:
    function: Contact pad on the bare face of the board, reached through a window in the front skin
    manufacturer: none
    mpn: board pad
    package: round pad, 2 mm
    size: [2.0, 2.0, 0.05]
    status: verified
    url: ""
  nfet:
    function: Small N-channel MOSFET
    manufacturer: to choose
    mpn: to choose
    package: "DFN1006 class"
    size: [1.0, 0.6, 0.4]
    status: unverified
    url: ""
  testpad:
    function: Test pad, bare copper
    manufacturer: none
    mpn: board pad
    package: round pad, 1 mm
    size: [1.0, 1.0, 0.05]
    status: verified
    url: ""
  celltabs:
    function: Pads the cell tabs are soldered to
    manufacturer: none
    mpn: board pads
    package: two pads
    size: [1.6, 4.4, 0.3]
    status: unverified
    url: ""
  passive0603:
    function: Bulk capacitor
    manufacturer: generic
    mpn: "0603"
    package: "0603"
    size: [1.6, 0.8, 0.8]
    status: verified
    url: ""
  passive0201:
    function: Radio and decoupling parts, bead, diode
    manufacturer: generic
    mpn: "0201"
    package: "0201"
    size: [0.6, 0.3, 0.3]
    status: verified
    url: ""
  passive0402:
    function: Resistor, capacitor, small inductor
    manufacturer: generic
    mpn: "0402"
    package: "0402"
    size: [1.0, 0.5, 0.55]
    status: verified
    url: ""

