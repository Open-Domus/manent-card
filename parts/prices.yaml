  - {item: "Assembly, one side, about 80 placements, QFN and 0201, X-ray", low: 1.50, high: 3.00, source: "estimate; JLCPCB's standard service is the class needed (0201, 0.6 mm board)"}
  - {item: "Cell, 2.0 x 35 x 80 mm, about 450 mAh, with leads", low: 1.50, high: 3.50, source: "estimate; one listing gives 1 to 2 for a stock 400 mAh cell at 1000"}
  - {item: "Back skin, aluminium 0.5 mm, cut and anodised", low: 1.00, high: 2.50, source: estimate}
  - {item: "Frame and front, glass-filled plastic, moulded", low: 0.50, high: 1.20, source: "estimate, tooling apart"}
  - {item: "Clear insert, button cap, switch cap, gaskets, membranes, adhesives", low: 0.60, high: 1.50, source: estimate}
  - {item: "Closing, programming and test by hand, 10 to 15 minutes in Italy", low: 5.00, high: 9.00, source: "estimate, at 30 to 36 dollars an hour"}
  - {item: "Sleeve with its magnet ring, and a steel ring", low: 1.20, high: 2.50, source: estimate}
  - {item: "Charger: cradle with four spring pins and a USB cable", low: 1.50, high: 3.00, source: estimate}
  - {item: "Box and leaflet", low: 0.60, high: 1.50, source: estimate}

# Paid once, whatever the number of cards.
once:
