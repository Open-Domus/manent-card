# Prices in US dollars for one piece when a thousand are bought, read on 2026-11-23.
# source: where the figure comes from. "estimate" means nobody was asked and no listing was read.
# Listings are snapshots found through a search engine, not quotes. match: the bill-of-materials
# value or part number the price applies to.
parts:
  - {match: nRF54L15, low: 1.81, high: 2.66, source: "Avnet 1.81 at 1000 (-R7); DigiKey 2.66 at 1000"}
  - {match: nPM1300, low: 1.40, high: 2.60, source: "Avnet 1.40 at 1000; aggregator range up to 2.60"}
  - {match: T5838, low: 1.33, high: 1.79, source: "Symmetry 1.33 at 1000; Avnet 1.79 at 5000"}
  - {match: V2S200D, low: 2.54, high: 2.73, source: "DigiKey 2.73 at 1000, 2.54 on a reel"}
  - {match: W25Q256JW, low: 1.62, high: 4.40, source: "two LCSC listings of the same part: 1.62 and 4.40"}
  - {match: SLW-66527511-SMT-TR, low: 0.27, high: 0.32, source: "DigiKey, 0.27 euro at 1000"}
  - {match: EVQ-P7 series, low: 0.18, high: 0.30, source: "DigiKey, EVQ-P7A01P 0.18 at 500"}
  - {match: 156125RS75000, low: 0.10, high: 0.30, source: estimate}
  - {match: S-82A1A, low: 0.20, high: 0.45, source: estimate}
  - {match: N-MOSFET, low: 0.03, high: 0.08, source: estimate}
  - {match: ESD230-B1-W0201, low: 0.04, high: 0.10, source: estimate}
  - {match: 32MHz, low: 0.20, high: 0.40, source: estimate}
  - {match: 9HT11-32.768KDZC-T, low: 0.25, high: 0.45, source: estimate}
  - {match: 2.2uH, low: 0.08, high: 0.20, source: estimate}
  - {match: 4.7uH, low: 0.03, high: 0.08, source: estimate}
  - {match: 2.4 GHz, low: 0.15, high: 0.40, source: estimate}
  - {match: RB521ZS-30, low: 0.02, high: 0.05, source: estimate}
  - {match: 10k NTC, low: 0.02, high: 0.05, source: estimate}
  - {match: ferrite bead, low: 0.01, high: 0.03, source: estimate}
  - {match: Murata RF, low: 0.02, high: 0.05, source: "estimate, each of the five matching parts"}
passive: {low: 0.003, high: 0.012, source: "estimate, each resistor or capacitor"}

# Everything that is not on the bill of materials. Per card, at a thousand cards.
rest:
